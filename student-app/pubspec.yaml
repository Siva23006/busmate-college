name: busmate_student
description: BusMate College - Student app (live bus map and estimated arrival).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  socket_io_client: ^3.0.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  google_maps_flutter: ^2.18.1
  # Phone notifications when the app is closed (bus started / arriving / at your stop)
  firebase_core:
  firebase_messaging:
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
