name: busmate_driver
description: BusMate College - Driver app (GPS tracking for the college bus).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  socket_io_client: ^3.0.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  wakelock_plus: ^1.2.8
  google_maps_flutter: ^2.18.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
